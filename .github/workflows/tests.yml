name: Tests

on:
  push:
  pull_request:
  schedule:
    # Runs Monday through Friday at 02:00 UTC
    - cron: '0 2 * * 1-5'

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and development dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13'
        run: pytest --pyargs approxkit

      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          pytest --pyargs approxkit \
            --cov=approxkit \
            --cov-branch \
            --cov-report=xml

      - name: Ruff check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          ruff --version
          ruff check .

      - name: Type check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: mypy src

      - name: Build package and validate metadata
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m build
          twine check dist/*

      - name: Upload results to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pbrod/approxkit