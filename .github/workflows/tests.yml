name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"


    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip

      - run: pip install -e ".[dev]"

      - run: pytest --pyargs approxkit --cov=approxkit

      - name: Ruff check
        if: matrix.python-version == '3.12'
        run: |
          ruff --version
          ruff check .

      - name: Type check
        if: matrix.python-version == '3.12'
        run: mypy src

      - run: python -m build

      - run: twine check dist/*