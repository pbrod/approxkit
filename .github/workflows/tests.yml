name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip

      - run: pip install -e .

      - run: pip install pytest build twine pytest-cov ruff mypy

      - run: pytest --pyargs approxkit --cov=approxkit

      - name: Ruff check
        run: ruff --version
        run: ruff check .

      - name: Type check
        run: mypy src

      - run: python -m build

      - run: twine check dist/*